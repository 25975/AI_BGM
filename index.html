<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Audio Studio · 游戏音频工作台</title>
<meta name="description" content="统一游戏音频工作台：BGM 循环配乐与 RPG 音效生成，两个页签，纯前端合成。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0b0e'/%3E%3Cpath d='M7 20v-8M12 23V9M17 26V6M22 21V11M27 18v-4' stroke='%2367e8f9' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #07080b;
    --panel: #0b0d11;
    --panel-2: #0f1218;
    --line: #1d222b;
    --line-2: #2a303b;
    --text: #f2f4f7;
    --muted: #8b95a5;
    --dim: #5d6675;
    --accent: #67e8f9;
    --accent-soft: rgba(103, 232, 249, .1);
    --accent-line: rgba(103, 232, 249, .45);
    --sans: "Segoe UI", system-ui, -apple-system, "Microsoft YaHei", "PingFang SC", sans-serif;
    --mono: "Cascadia Mono", "Consolas", "SF Mono", monospace;
  }
  body[data-tab="sfx"] {
    --accent: #f5a623;
    --accent-soft: rgba(245, 166, 35, .1);
    --accent-line: rgba(245, 166, 35, .45);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  html { color-scheme: dark; }
  body {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background:
      radial-gradient(800px 380px at 12% -20%, rgba(103, 232, 249, .06), transparent 60%),
      radial-gradient(700px 380px at 92% -10%, rgba(245, 166, 35, .05), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 13px;
    -webkit-font-smoothing: antialiased;
    transition: background .35s;
  }
  button { font-family: inherit; }
  ::selection { background: var(--accent-soft); color: #fff; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .shell-top {
    flex: none;
    display: flex;
    align-items: center;
    gap: 22px;
    padding: 10px 22px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(11, 13, 17, .98), rgba(8, 9, 12, .94));
    position: relative;
    z-index: 5;
  }
  .shell-top::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: -1px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent-line), transparent);
    opacity: .5;
    transition: opacity .3s;
  }
  .shell-brand { display: flex; align-items: center; gap: 11px; min-width: 0; flex: none; }
  .shell-mark {
    width: 34px; height: 34px; flex: none;
    color: var(--accent);
    display: grid; place-items: center;
    border: 1px solid var(--line-2);
    border-radius: 8px;
    background: linear-gradient(160deg, var(--accent-soft), transparent 70%);
    transition: color .3s, background .3s;
  }
  .shell-mark svg { width: 24px; height: 24px; display: block; }
  .shell-title { min-width: 0; }
  .shell-title h1 {
    margin: 0; font-size: 14px; font-weight: 700;
    letter-spacing: .16em; color: #f8fafc; line-height: 1.15;
    white-space: nowrap;
  }
  .shell-title p {
    margin: 2px 0 0; font-size: 9px; letter-spacing: .14em;
    color: var(--dim); text-transform: uppercase; white-space: nowrap;
  }
  .shell-tabs {
    display: flex; align-items: stretch; gap: 3px;
    padding: 3px; border: 1px solid var(--line);
    border-radius: 9px; background: #0b0d12;
    flex: none;
  }
  .shell-tab {
    display: flex; align-items: center; gap: 9px;
    border: 1px solid transparent; border-radius: 6px;
    background: transparent; color: var(--muted);
    padding: 7px 14px 7px 12px; cursor: pointer;
    text-align: left; transition: color .16s, background .16s, border-color .16s;
    min-width: 0;
  }
  .shell-tab:hover { color: var(--text); background: #12151c; }
  .shell-tab.on {
    color: var(--text);
    background: linear-gradient(180deg, var(--accent-soft), rgba(255, 255, 255, .015));
    border-color: var(--accent-line);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .04);
  }
  .tab-num {
    font-family: var(--mono); font-size: 9px; color: var(--dim);
    letter-spacing: .06em; transition: color .16s;
  }
  .shell-tab.on .tab-num { color: var(--accent); }
  .tab-text { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
  .tab-text b { font-size: 12.5px; font-weight: 600; letter-spacing: .03em; white-space: nowrap; }
  .tab-text small { font-size: 8.5px; color: var(--dim); margin-top: 2px; letter-spacing: .04em; white-space: nowrap; }
  .shell-tab.on .tab-text small { color: #aab4c4; }

  .shell-meta {
    margin-left: auto; display: flex; align-items: center; gap: 7px;
    font-size: 9px; color: var(--dim); letter-spacing: .06em; white-space: nowrap;
  }
  .meta-dot {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 8px var(--accent-line);
    transition: background .3s;
  }
  .shell-meta a {
    color: #9aa5b5; text-decoration: none; border-bottom: 1px solid #2a303b;
    padding-bottom: 1px; margin-left: 4px;
  }
  .shell-meta a:hover { color: var(--accent); border-color: var(--accent); }

  .shell-main { flex: 1; position: relative; min-height: 0; background: #07080b; }
  .frame {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    border: 0; display: none; background: #07080b;
  }
  .frame.on { display: block; }

  .veil {
    position: absolute; inset: 0; z-index: 3;
    display: grid; place-items: center; align-content: center; gap: 14px;
    background: #07080b; color: var(--muted);
    transition: opacity .25s;
  }
  .veil.hidden { opacity: 0; pointer-events: none; }
  .spinner {
    width: 26px; height: 26px; border-radius: 50%;
    border: 2px solid #232a35; border-top-color: var(--accent);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .veil p { margin: 0; font-size: 10.5px; letter-spacing: .06em; }
  .veil small { font-size: 9px; color: var(--dim); max-width: 340px; line-height: 1.6; text-align: center; }

  @media (max-width: 1100px) {
    .shell-meta { display: none; }
    .shell-top { gap: 14px; }
  }
  @media (max-width: 760px) {
    .shell-top { flex-wrap: wrap; padding: 9px 12px 8px; row-gap: 8px; }
    .shell-brand { flex: 1; }
    .shell-tabs { flex: 1 0 100%; order: 2; }
    .shell-tab { flex: 1; justify-content: center; padding: 7px 8px; }
    .shell-title h1 { font-size: 12.5px; letter-spacing: .1em; }
    .shell-title p { display: none; }
    .shell-mark { width: 30px; height: 30px; }
  }
  @media (max-width: 520px) {
    .tab-text small { display: none; }
    .tab-num { font-size: 8px; }
    .tab-text b { font-size: 11.5px; }
    .shell-tab { gap: 6px; padding: 7px 6px; }
  }
</style>
</head>
<body data-tab="bgm">

<header class="shell-top">
  <div class="shell-brand">
    <div class="shell-mark" aria-hidden="true">
      <svg viewBox="0 0 36 36" fill="none">
        <path d="M4 22v-8M10 26V10M16 29V7M22 24V12M28 27V9M34 20v-4"
              stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="shell-title">
      <h1>GAME AUDIO STUDIO</h1>
      <p>游戏音频工作台</p>
    </div>
  </div>

  <nav class="shell-tabs" role="tablist" aria-label="工作台切换">
    <button class="shell-tab on" id="tab-bgm" data-tab="bgm" role="tab"
            aria-selected="true" aria-controls="frame-bgm">
      <span class="tab-num">01</span>
      <span class="tab-text"><b>BGM 工坊</b><small>循环配乐 · 18 风格</small></span>
    </button>
    <button class="shell-tab" id="tab-sfx" data-tab="sfx" role="tab"
            aria-selected="false" aria-controls="frame-sfx" tabindex="-1">
      <span class="tab-num">02</span>
      <span class="tab-text"><b>音效工坊</b><small>打击 / 技能 / 锻造</small></span>
    </button>
  </nav>

  <div class="shell-meta">
    <span class="meta-dot"></span>
    <span>纯前端合成 · 无采样</span>
    <a id="openApp" href="apps/loopforge.html" target="_blank" rel="noopener">新窗口 ↗</a>
  </div>
</header>

<main class="shell-main">
  <iframe id="frame-bgm" class="frame on" src="apps/loopforge.html?embed=1"
          title="LoopForge 游戏 BGM 工坊" allow="autoplay"></iframe>
  <iframe id="frame-sfx" class="frame" data-src="apps/forgefx.html?embed=1"
          title="ForgeFX RPG 音效工坊" allow="autoplay"></iframe>

  <div class="veil" id="veil">
    <div class="spinner"></div>
    <p id="veilText">正在载入 BGM 工坊…</p>
    <small>如果一直停在这里：请用本地服务器打开（如 <code>python -m http.server</code>），或部署到静态站点。</small>
  </div>
</main>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var tabs = Array.prototype.slice.call(document.querySelectorAll('.shell-tab'));
  var frames = { bgm: $('frame-bgm'), sfx: $('frame-sfx') };
  var loaded = { bgm: false, sfx: false };
  var current = null;
  var veil = $('veil');
  var veilText = $('veilText');
  var NAME = { bgm: 'BGM 工坊', sfx: '音效工坊' };
  var FILE = { bgm: 'apps/loopforge.html', sfx: 'apps/forgefx.html' };

  function showVeil(name) {
    veilText.textContent = '正在载入 ' + NAME[name] + '…';
    veil.classList.remove('hidden');
  }
  function hideVeil() { veil.classList.add('hidden'); }

  function frameComplete(frame) {
    try {
      return !!(frame.contentDocument && frame.contentDocument.readyState === 'complete');
    } catch (e) { return false; }
  }

  function setTab(name, push) {
    if (name !== 'bgm' && name !== 'sfx') name = 'bgm';
    if (name === current) return;
    current = name;
    document.body.setAttribute('data-tab', name);
    tabs.forEach(function (tab) {
      var on = tab.getAttribute('data-tab') === name;
      tab.classList.toggle('on', on);
      tab.setAttribute('aria-selected', on ? 'true' : 'false');
      tab.tabIndex = on ? 0 : -1;
    });
    Object.keys(frames).forEach(function (key) {
      var frame = frames[key];
      var on = key === name;
      frame.classList.toggle('on', on);
      frame.setAttribute('aria-hidden', on ? 'false' : 'true');
      if (on && !frame.getAttribute('src') && frame.getAttribute('data-src')) {
        frame.setAttribute('src', frame.getAttribute('data-src'));
      }
    });
    $('openApp').setAttribute('href', FILE[name]);
    document.title = NAME[name] + ' · Game Audio Studio';
    if (loaded[name] || frameComplete(frames[name])) {
      loaded[name] = true;
      hideVeil();
    } else {
      showVeil(name);
    }
    if (push !== false) {
      try { history.replaceState(null, '', '#' + name); } catch (e) {}
    }
  }

  Object.keys(frames).forEach(function (key) {
    frames[key].addEventListener('load', function () {
      loaded[key] = true;
      if (current === key) hideVeil();
    });
  });

  tabs.forEach(function (tab) {
    tab.addEventListener('click', function () { setTab(tab.getAttribute('data-tab')); });
    tab.addEventListener('keydown', function (e) {
      var idx = tabs.indexOf(tab);
      var next = null;
      if (e.key === 'ArrowRight') next = (idx + 1) % tabs.length;
      else if (e.key === 'ArrowLeft') next = (idx - 1 + tabs.length) % tabs.length;
      else if (e.key === 'Home') next = 0;
      else if (e.key === 'End') next = tabs.length - 1;
      if (next !== null) {
        e.preventDefault();
        var target = tabs[next];
        target.focus();
        setTab(target.getAttribute('data-tab'));
      }
    });
  });

  window.addEventListener('hashchange', function () {
    setTab(location.hash.replace('#', ''), false);
  });

  setTab(location.hash === '#sfx' ? 'sfx' : 'bgm', false);
  setTimeout(function () {
    if (current && frameComplete(frames[current])) {
      loaded[current] = true;
      hideVeil();
    }
  }, 500);
})();
</script>
</body>
</html>
